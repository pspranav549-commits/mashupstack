<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        h3 {
            text-align: right;
            font-family: "Georgia", serif;
            font-size: 28px;
            color: darkred;
        }

        .welcome {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            word-spacing: 6px;
        }

        table {
            width: 60%;
            margin: 25px auto;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #000;
            padding: 12px;
            vertical-align: middle;
        }

        a {
            text-decoration: none;
            color: brown;
            font-weight: bold;
        }
        a:hover {
            color: darkgreen;
        }
    </style>
</head>
<body>

    <h3>
        Gourmet Palace 
        <i class="fa-solid fa-utensils"></i>
        <i class="fa-solid fa-pepper-hot"></i>
    </h3>

    <p class="welcome">Welcome to our delicious world</p>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Grilled Chicken</td>
            <td>₹350</td>
        </tr>
        <tr>
            <td>Veg Pasta</td>
            <td>₹250</td>
        </tr>
        <tr>
            <td>Chocolate Shake</td>
            <td>₹180</td>
        </tr>
    </table>

    <p style="text-align:center;">
        <a href="#">Visit Our Website</a>
    </p>

</body>
</html>
