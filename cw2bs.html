    <!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        blockquote {
            text-align: center;
            font-style: italic;
            color: #555;
            margin-bottom: 30px;
        }
        .profile-img {
            display: block;
            margin: 0 auto;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        table {
            width: 60%;
            margin: 30px auto;
            border-collapse: collapse;
            font-size: 18px;
        }

        thead {
            background-color: #222;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .alert-success {
            width: 60%;
            margin: 20px auto;
            padding: 15px;
            background-color: #c8f7c5;
            color: #2e7d32;
            font-weight: bold;
            border-left: 6px solid #2e7d32;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Student Profile</h1>

    <blockquote>“Learning never exhausts the mind.”</blockquote>

    <img src="https://www.mashupstack.com/assets/uploads/placedStudents/86574209a42f76985989b6273cebaf02.jpg"class="mx-auto d-block rounded-circle" height="60px" width="60px" alt="Profile Image" class="profile-img">

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>92</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>88</td>
            </tr>
            <tr>
                <td>English</td>
                <td>95</td>
            </tr>
        </tbody>
    </table>

    <div class="alert-success">
        Profile updated successfully!
    </div>

</body>
</html>
