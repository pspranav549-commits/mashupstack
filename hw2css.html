<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        .card {
            width: auto;               
            height: 400px;          
            border: 2px solid #4CAF50; 
            border-radius: 10px;
            margin: 20px auto;       
            padding: 15px;             
            max-width: 350px;          
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .card img {
            max-width: 100%;         
            min-width: 200px;         
            height: auto;
            border-radius: 5px;
        }

        .product-name {
            font-size: 2.5em;
            margin: 20px 0;
            font-weight: bold;
        }

        .product-desc {
            font-size: 2em;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="https://via.placeholder.com/300" alt="Product Image">

        <div class="product-name">Premium Headphones</div>

        <div class="product-desc">
            High-quality wireless headphones with crystal clear sound and long-lasting battery life.
        </div>
    </div>

</body>
</html>
