<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Announcement</title>
    <style>
        h2 {
            text-align: center;
        }
        .notice-box {
            background: #f4f4f4;
            padding: 20px;
            width: 60%;
            margin: 20px auto;
            overflow: auto;
            position: relative;
        }
        .notice-box img {
            width: 120px;
            height: 120px;
            float: left;
            margin-right: 15px;
            img;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffcc00;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .clear {
            clear: both;
        }
    </style>
</head>
<body>

    <h2>Important Notice</h2>

    <div class="notice-box">
        <span class="badge">NEW</span>
        <img src="https://www.mashupstack.com/assets/uploads/placedStudents/ad4504ca75f2d7f8d4ab8ff31af15766.jpg" alt="Notice Image" />
        <p>
            Dear students, this is to inform you that the annual sports meet will be held next month. All students are encouraged to participate. More details will be shared soon. Stay tuned for updates as we prepare for an exciting event filled with various competitions and activities.
        </p>
        <div class="clear"></div>
    </div>

</body>
</html>
