<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Contact Card</title>

    <style>
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 22px;
            font-weight: bold;
            z-index: 1000;
        }

        body {
            margin: 0;
            padding-top: 80px; 
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .profile-container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            position: relative;
            border: 1px solid #ddd;
            overflow: auto; 
        }
        .profile-container img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            float: left;
            margin-right: 15px;
            border-radius: 8px;
        }
        .info-text {
            text-align: center;
        }
        .contact-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            background-color: #eaeaea;
            padding: 15px;
            border: 1px solid #bbb;
            border-radius: 8px;
            text-align: center;
        }
        .vertical-line {
            position: absolute;
            top: 20px;
            bottom: 20px;
            right: 250px; 
            border-right: 2px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        Company Contact Card
    </header>
    <div class="profile-container">
       <div class="vertical-line"></div>

    
        <img src="https://www.mashupstack.com/assets/uploads/placedStudents/aa87f18a2006dd6de8826b1b8b8e8eaa.jpg" alt="Profile">
        <div class="info-text">
            <h2>Abin</h2>
            <h4>Senior Software Engineer</h4>
            <p>
              Abin is an experienced developer specializing in backend systems,
                API design, and cloud architecture. Passionate about building 
                scalable, secure applications.
            </p>
        </div>
        <div class="contact-box">
            <h3>Contact Info</h3>
            <p>📞 +8921836077</p>
            <p>📧 pspranav549@gmail.com</p>
        </div>

    </div>

</body>
</html>
