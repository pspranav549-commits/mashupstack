  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin: 30px;
    }
    .breadcrumb{
        font-size: 14px;
        margin-bottom: 20px;
    }
    .breadcrumb span{
        color: #555;
    }
    .btn-outline{
        padding: 8px 16px;
        border: 2px solid #007bff;
        color: #007bff;
        background: transparent;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }
    .btn-outline:hover{
        background: #007bff;
        color: #fff;
    }
    .badge{
        background: #28a745;
        padding: 4px 10px;
        color: white;
        font-size: 12px;
        border-radius: 12px;
        margin-left: 10px;
    }
    .progress{
        width: 100%;
        height: 22px;
        background: #e9ecef;
        border-radius: 5px;
        overflow: hidden;
        margin: 20px 0;
        position: relative;
    }
    .progress-bar{
        height: 100%;
        width: 70%;
        background: linear-gradient(45deg, #007bff 25%, #3399ff 25%, #3399ff 50%, #007bff 50%, #007bff 75%, #3399ff 75%, #3399ff);
        background-size: 30px 30px;
        animation: move 1s linear infinite;
    }
    @keyframes move {
        0%{ background-position: 0 0; }
        100%{ background-position: 30px 0; }
    }
    .pagination{
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }
    .page{
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
    }
    .page.active{
        background: #007bff;
        color: white;
        border-color: #007bff;
    }
</style>
</head>

<body>
    <div class="breadcrumb">
        <span>Home > Dashboard > <strong>My Courses</strong></span>
    </div>
    <button class="btn-outline">Start New Course</button>
    <div class="spinner-grow text-primary"></div>
    <h2 style="margin-top:20px;">
        My Progress 
        <span class="badge">3 Courses</span>
    </h2>
    <div class="progress">
        <div class="progress-bar"></div>
    </div>
    <div class="pagination">
        <div class="page">1</div>
        <div class="page active">2</div>
        <div class="page">3</div>
    </div>

</body>
</html>

</head>
