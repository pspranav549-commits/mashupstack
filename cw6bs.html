<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback from a website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .feedback-form {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feedback-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-group label {
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <form class="feedback-form">
        <h2>Feedback Form</h2>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="feedback">Feedback Message</label>
            <textarea id="feedback" placeholder="Write your feedback here..."></textarea>
        </div>

        <div class="form-group">
            <label for="source">How did you find our site?</label>
            <select id="source">
                <option value="">Select an option</option>
                <option>Search Engine</option>
                <option>Social Media</option>
                <option>Friend or Referral</option>
                <option>Advertisement</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Satisfaction Level</label>
            <div class="radio-group">
                <label><input type="radio" name="satisfaction"> 1</label>
                <label><input type="radio" name="satisfaction"> 2</label>
                <label><input type="radio" name="satisfaction"> 3</label>
                <label><input type="radio" name="satisfaction"> 4</label>
                <label><input type="radio" name="satisfaction"> 5</label>
            </div>
        </div>

        <button type="submit">Submit Feedback</button>
    </form>

</body>
</html>

</head>
