<title>Product Card</title>

<style>
    .product-card {
        width: 250px;
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 10px;
        text-align: left;
        background-color: white;
        margin: 20px auto;
        transition: background-color 0.3s ease;
    }
    .product-img {
        width: 100%;
        border: 2px solid black;
        border-top-left-radius: 15px;
        border-bottom-right-radius: 15px;
    }

    .product-name {
        font-size: 20px;
        margin: 10px 0;
        font-weight: bold;
    }

    .buy-btn {
        padding: 10px 15px;
        background-color: green;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    @media (max-width: 600px) {
        .product-card {
            font-size: 14px;
            text-align: center;
        }
        .product-name {
            font-size: 16px;
        }
    }
    @media screen and (orientation: landscape) {
        .product-card {
            background-color: lightblue;
        }
    }
</style>
