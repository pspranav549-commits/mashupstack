<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Progress Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Courses</a></li>
                <li class="breadcrumb-item active" aria-current="page">Web Development</li>
            </ol>
        </nav>

        <div class="text-center mb-4">
            <h2 class="fw-bold">
                Web Development Course
                <span class="badge bg-success ms-2">New</span>
            </h2>
        </div>

        <div class="mx-auto" style="max-width: 600px;">
            <label class="fw-semibold">HTML – 100%</label>
            <div class="progress mb-3">
                <div class="progress-bar bg-success progress-bar-striped"
                     role="progressbar" style="width: 100%;">100%</div>
            </div>
            <label class="fw-semibold">CSS – 75%</label>
            <div class="progress mb-3">
                <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
                     role="progressbar" style="width: 75%;">75%</div>
            </div>
            <label class="fw-semibold">JavaScript – 50%</label>
            <div class="progress mb-3">
                <div class="progress-bar" style="width: 50%; background-color: orange;">
                    50%
                </div>
            </div>
            <label class="fw-semibold">Bootstrap – 25%</label>
            <div class="progress mb-4">
                <div class="progress-bar bg-danger" style="width: 25%;">25%</div>
            </div>

        </div>
        <div class="text-center mb-4">
            <div class="btn-group" role="group">
                <button class="btn btn-success">Start</button>
                <button class="btn btn-warning">Pause</button>
                <button class="btn btn-danger">Reset</button>
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <nav>
                <ul class="pagination">
                    <li class="page-item active">
                        <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item disabled">
                        <a class="page-link">3</a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

</head>

</body>
</html>
